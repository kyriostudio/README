name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-ionos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.IONOS_SFTP_HOST }}
      USERNAME: ${{ secrets.IONOS_SFTP_USERNAME }}
      RAW_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/.htaccess

      - name: Contrôle des secrets IONOS
        run: |
          set -euo pipefail
          for v in HOST USERNAME RAW_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret manquant : configurez IONOS_SFTP_HOST, IONOS_SFTP_USERNAME et IONOS_SFTP_PASSWORD sur ce dépôt (Settings → Secrets → Actions)." >&2
              exit 1
            fi
          done
          echo "::notice::SFTP → ${USERNAME}@${HOST} (port 22)"
          if [ "${USERNAME}" = "su359443" ]; then
            echo "::error::IONOS_SFTP_USERNAME encore su359443. Compte actuel IONOS : su247348." >&2
            exit 1
          fi
          if [ "${HOST}" != "access-5020224280.webspace-host.com" ]; then
            echo "::warning::IONOS_SFTP_HOST=${HOST} — vérifiez qu'il correspond au contrat Web IONOS actuel."
          fi

      - name: Outils SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client > /dev/null

      - name: Empreinte du serveur
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      # Compte IONOS souvent « SFTP only » : ssh interactif échoue (PTY/shell) alors que SFTP fonctionne.
      - name: Test connexion SFTP
        run: |
          set -euo pipefail
          PASS_TRIMMED="$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')"
          export SSHPASS="$PASS_TRIMMED"
          BATCH="$(mktemp)"
          printf '%s\n' 'pwd' 'ls' 'bye' > "$BATCH"
          sshpass -e sftp \
            -oBatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=45 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -b "$BATCH" \
            "${USERNAME}@${HOST}" \
          || {
            echo "::error::SFTP refusé. Vérifiez IONOS_SFTP_USERNAME (su247348) et le mot de passe sur kyriostudio/README." >&2
            echo "::notice::Si « ssh » affiche PTY/shell failed en local, c'est normal : utilisez SFTP ou ce workflow." >&2
            exit 1
          }
          rm -f "$BATCH"

      # wlixcc : dernier déploiement vert sur ce dépôt (avril 2026)
      - name: Deploy dist to IONOS (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.IONOS_SFTP_HOST }}
          username: ${{ secrets.IONOS_SFTP_USERNAME }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: 22
          local_path: ./dist/*
          remote_path: /
          sftp_only: true
          sftpArgs: "-o ConnectTimeout=45 -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no"

      - name: Deploy .htaccess (réécriture SPA)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.IONOS_SFTP_HOST }}
          username: ${{ secrets.IONOS_SFTP_USERNAME }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: 22
          local_path: ./dist/.htaccess
          remote_path: /
          sftp_only: true
          sftpArgs: "-o ConnectTimeout=45 -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no"

      - name: Vérification HTTPS
        run: |
          sleep 4
          CODE=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" https://kyrio.fr/)
          echo "kyrio.fr → HTTP ${CODE}"
          test "$CODE" = "200"